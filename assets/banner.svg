<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Filters -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes floatCard3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.04); }
      }
      @keyframes streamFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      .card-float-1 { animation: floatCard1 6s ease-in-out infinite; }
      .card-float-2 { animation: floatCard2 7s ease-in-out infinite 1s; }
      .card-float-3 { animation: floatCard3 5.5s ease-in-out infinite 0.5s; }
      .pulsing-glow { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .flow-path { stroke-dasharray: 8 12; animation: streamFlow 4s linear infinite; }
    </style>
  </defs>

  <!-- Deep Tech Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid-pattern)" rx="16" />

  <!-- Ambient Light Orbs (Dynamic Background) -->
  <g class="pulsing-glow">
    <circle cx="150" cy="80" r="140" fill="#6366f1" opacity="0.15" filter="url(#subtle-glow)" />
    <circle cx="1050" cy="280" r="160" fill="#06b6d4" opacity="0.12" filter="url(#subtle-glow)" />
    <circle cx="900" cy="90" r="130" fill="#8b5cf6" opacity="0.18" filter="url(#subtle-glow)" />
  </g>

  <!-- Animated Connection Streamlines behind cards -->
  <g opacity="0.4">
    <path class="flow-path" d="M 680 180 C 740 180, 750 140, 810 140 C 870 140, 880 200, 940 200 C 1000 200, 1030 150, 1120 150" fill="none" stroke="#6366f1" stroke-width="2" />
    <path class="flow-path" d="M 680 240 C 760 240, 780 270, 850 270 C 920 270, 950 220, 1020 220 C 1080 220, 1100 250, 1150 250" fill="none" stroke="#06b6d4" stroke-width="1.5" />
  </g>

  <!-- Dynamic Kanban Board Mockup (Right Side Graphics) -->
  <g transform="translate(700, 45)">
    <!-- Kanban Column 1: Backlog -->
    <rect x="0" y="0" width="130" height="270" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.9" />
    <text x="14" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">TO DO</text>
    <rect x="92" y="14" width="22" height="14" rx="7" fill="#1e293b" />
    <text x="100" y="24" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">3</text>
    
    <!-- Card 1.1 -->
    <g class="card-float-1">
      <rect x="10" y="42" width="110" height="60" rx="6" fill="url(#card-grad-1)" stroke="#475569" stroke-width="1" />
      <rect x="18" y="52" width="36" height="4" rx="2" fill="url(#accent-amber)" />
      <rect x="18" y="64" width="75" height="5" rx="2.5" fill="#e2e8f0" opacity="0.9" />
      <rect x="18" y="74" width="55" height="4" rx="2" fill="#64748b" />
      <circle cx="102" cy="85" r="7" fill="#3b82f6" />
    </g>

    <!-- Card 1.2 -->
    <g class="card-float-3">
      <rect x="10" y="112" width="110" height="65" rx="6" fill="url(#card-grad-1)" stroke="#334155" stroke-width="1" />
      <rect x="18" y="122" width="44" height="4" rx="2" fill="#818cf8" />
      <rect x="18" y="134" width="80" height="5" rx="2.5" fill="#cbd5e1" opacity="0.8" />
      <rect x="18" y="144" width="60" height="4" rx="2" fill="#64748b" />
      <circle cx="102" cy="158" r="7" fill="#ec4899" />
    </g>

    <!-- Kanban Column 2: In Progress -->
    <rect x="148" y="0" width="135" height="270" rx="10" fill="#0f172a" stroke="#4f46e5" stroke-width="1.8" opacity="0.95" />
    <text x="162" y="24" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">IN PROGRESS</text>
    <rect x="246" y="14" width="22" height="14" rx="7" fill="#312e81" />
    <text x="254" y="24" fill="#a5b4fc" font-family="sans-serif" font-size="10" font-weight="600">2</text>

    <!-- Card 2.1 (Active) -->
    <g class="card-float-2">
      <rect x="158" y="42" width="115" height="74" rx="6" fill="url(#card-grad-2)" stroke="#6366f1" stroke-width="1.2" />
      <rect x="168" y="52" width="48" height="4" rx="2" fill="url(#accent-cyan)" />
      <rect x="168" y="64" width="88" height="6" rx="3" fill="#ffffff" />
      <rect x="168" y="76" width="65" height="4" rx="2" fill="#94a3b8" />
      <!-- Progress Bar -->
      <rect x="168" y="93" width="70" height="4" rx="2" fill="#1e1b4b" />
      <rect x="168" y="93" width="48" height="4" rx="2" fill="url(#accent-cyan)" />
      <circle cx="255" cy="94" r="8" fill="#10b981" />
    </g>

    <!-- Card 2.2 -->
    <g class="card-float-1">
      <rect x="158" y="126" width="115" height="62" rx="6" fill="url(#card-grad-1)" stroke="#475569" stroke-width="1" />
      <rect x="168" y="136" width="38" height="4" rx="2" fill="#ec4899" />
      <rect x="168" y="148" width="78" height="5" rx="2.5" fill="#e2e8f0" opacity="0.9" />
      <rect x="168" y="158" width="50" height="4" rx="2" fill="#64748b" />
      <circle cx="255" cy="170" r="7" fill="#f59e0b" />
    </g>

    <!-- Kanban Column 3: Completed / Done -->
    <rect x="298" y="0" width="130" height="270" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" opacity="0.9" stroke-dasharray="3 3" />
    <text x="312" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">DONE</text>
    <rect x="390" y="14" width="22" height="14" rx="7" fill="#064e3b" />
    <text x="398" y="24" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="600">5</text>

    <!-- Card 3.1 -->
    <g class="card-float-3">
      <rect x="308" y="42" width="110" height="58" rx="6" fill="url(#card-grad-1)" stroke="#059669" stroke-width="1" opacity="0.85" />
      <rect x="318" y="52" width="40" height="4" rx="2" fill="url(#accent-emerald)" />
      <rect x="318" y="64" width="82" height="5" rx="2.5" fill="#94a3b8" />
      <path d="M 398 80 L 403 85 L 413 75" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <g class="card-float-2">
      <rect x="308" y="110" width="110" height="58" rx="6" fill="url(#card-grad-1)" stroke="#059669" stroke-width="1" opacity="0.85" />
      <rect x="318" y="120" width="34" height="4" rx="2" fill="url(#accent-emerald)" />
      <rect x="318" y="132" width="70" height="5" rx="2.5" fill="#94a3b8" />
      <path d="M 398 148 L 403 153 L 413 143" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Foreground Content: Title, Badges, Subtitle (Guaranteed in front) -->
  <g transform="translate(60, 60)">
    <!-- Pill Category Badge -->
    <g>
      <rect x="0" y="0" width="235" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="16" cy="16" r="5" fill="#06b6d4" />
      <text x="32" y="21" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">CURATED AWESOME STACK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      Enterprise Kanban
    </text>
    <text x="0" y="135" fill="url(#primary-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      &amp; Workflow Collaboration
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="180" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      The authoritative guide to enterprise agile boards, visual portfolio tracking,
    </text>
    <text x="0" y="204" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      commercial SaaS suites &amp; production-grade self-hosted open-source software.
    </text>

    <!-- Capability Feature Badges -->
    <g transform="translate(0, 235)">
      <!-- Badge 1: SaaS & Self-Hosted -->
      <rect x="0" y="0" width="138" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="500">⚡ SaaS &amp; Self-Hosted</text>

      <!-- Badge 2: Open Source -->
      <rect x="148" y="0" width="118" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="162" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="500">⭐ Open Source</text>

      <!-- Badge 3: Portfolio & WIP Limits -->
      <rect x="276" y="0" width="170" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="290" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="500">🎯 Scaled Agile &amp; SPM</text>
    </g>
  </g>
</svg>